# db-tunnel configuration
#
# Copy this file to one of the following locations:
#   ~/.config/db-tunnel/config.toml  (recommended)
#   ~/.db-tunnel.toml
#   config.toml (next to the db-tunnel binary)

# Global defaults — applied to databases that don't specify their own.
aws_profile = "my-aws-profile"
aws_region = "ap-southeast-2"

# Global-only settings
# verbose = true
# license = "your-7777-license-key"

# Global defaults with per-database override support
# security_group = "sg-0123456789abcdef0"
# subnet = "subnet-0123456789abcdef0"
# ttl = 2
# forever = false

# Each [[database]] block defines a tunnel target.
# Required fields: name, database, port
# Optional fields: aws_profile, aws_region, security_group, subnet,
#                  ttl, forever, elasticache (override globals where applicable)

[[database]]
name = "Production Main"
database = "myapp-prod-master"
port = 7700

[[database]]
name = "Production EU"
database = "myapp-prod-eu"
port = 7701
aws_region = "eu-west-1"

[[database]]
name = "Staging"
database = "myapp-stage"
port = 7710
forever = true

[[database]]
name = "Other Project"
database = "other-project-db"
port = 7720
aws_profile = "other-project"
aws_region = "us-east-1"
security_group = "sg-0987654321fedcba0"
subnet = "subnet-0987654321fedcba0"

# [[database]]
# name = "ElastiCache"
# database = "my-elasticache-cluster"
# port = 7730
# elasticache = true
